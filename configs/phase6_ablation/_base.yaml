# Base config compartida por todas las variantes de la ablación Fase 6.
# Cada YAML específica solo overridea lo que cambia.

# ── Modelo (ConfigV4 fields) ────────────────────────────────────────
model:
  dim: 256
  n_heads: 8
  n_kv_heads: 4
  n_streams: 4
  n_territorios: 4
  n_levels: 3
  n_zonas: 52
  vocab_size: 48000
  ffn_mult: 2.5
  modulator_bottleneck: 32
  max_seq_len: 512
  dropout: 0.0
  use_checkpoint: false
  use_mixed_selectivity: true
  # Fase 6 flags (overrideados por variante)
  use_hierarchical_modulators: false
  use_recurrent_loop: false
  max_loop_iters: 3
  use_lti_injection: false
  use_act_halting: false
  act_loop_threshold: 0.99
  use_loop_index_rope: false
  share_ffn_across_niveles: false
  disable_loop_idx_in_modulator: false

# ── Training ────────────────────────────────────────────────────────
training:
  data_path: "data/clean_sft.jsonl"
  tokenizer_path: "data/tokenizer/pampar_48k.model"
  output_dir: "ablation_results/phase6"
  max_steps: 2000
  batch_size: 8
  seq_len: 256
  lr: 3.0e-4
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 200
  log_every: 25
  ckpt_every: 1000
  val_split: 0.1
  amp: true # mixed precision en GPU
  seed: 42
